name: Publish ABO ADNAN SAYO PS4 Host

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "logo-1.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ps4-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download complete RAW13G host
        shell: bash
        run: |
          git clone --depth 1 https://github.com/raw13g/raw13g.github.io.git site

          rm -rf site/.git

          if [ ! -s logo-1.png ]; then
            echo "ERROR: logo-1.png not found"
            exit 1
          fi

          cp logo-1.png site/logo-1.png

      - name: Apply ABO ADNAN branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path("site")

          required = [
              "index.html",
              "jb.html",
              "jb.js",
              "core.js",
              "mem.js",
              "int64.js",
              "ps4_offsets.js",
              "rpc_worker.js",
              "payload2.bin",
              "cache.appcache",
              "LICENSE",
              "logo-1.png"
          ]

          for file in required:
              path = root / file
              if not path.is_file() or not path.stat().st_size:
                  raise RuntimeError("Missing file: " + file)

          idx_path = root / "index.html"
          idx = idx_path.read_text(encoding="utf-8")

          found = re.search(
              r'var\s+SUPPORTED\s*=\s*\{([^}]+)\}',
              idx
          )

          if not found:
              raise RuntimeError("Version detector changed")

          supported_table = found.group(1)

          for fw in ("1302", "1304", "1350", "1352"):
              if not re.search(
                  r'\b' + fw + r'\s*:\s*1\b',
                  supported_table
              ):
                  raise RuntimeError(
                      "Firmware not supported upstream: " + fw
                  )

          if re.search(
              r'\b1358\s*:\s*1\b',
              supported_table
          ):
              raise RuntimeError(
                  "Firmware 13.58 needs verification"
              )

          force_code = 'var forced = params.get("force") === "1";'

          unsafe_message = (
              'waitForTap("UNSUPPORTED (" + '
              '(key || "unknown") + '
              '") -- press X or tap to run anyway", go);'
          )

          if force_code not in idx or unsafe_message not in idx:
              raise RuntimeError("Safety gate changed")

          idx = idx.replace(
              force_code,
              'var forced = false;'
          )

          idx = idx.replace(
              unsafe_message,
              'setCache("Supported: 13.02 / 13.04 / '
              '13.50 / 13.52. '
              '13.58 is not supported by this build.");'
          )

          brand_image = re.compile(
              r"(<div\b[^>]*\bid\s*=\s*"
              r"[\'\"]brand[\'\"][^>]*>\s*"
              r"<img\b)([^>]*)(>)",
              re.IGNORECASE | re.DOTALL
          )

          def replace_logo(match):
              attrs = match.group(2)

              source = re.compile(
                  r"\bsrc\s*=\s*([\'\"]).*?\1",
                  re.IGNORECASE | re.DOTALL
              )

              if source.search(attrs):
                  attrs = source.sub(
                      'src="logo-1.png"',
                      attrs,
                      count=1
                  )
              else:
                  attrs += ' src="logo-1.png"'

              return match.group(1) + attrs + match.group(3)

          for filename in ("index.html", "jb.html"):

              path = root / filename

              if filename == "index.html":
                  html = idx
              else:
                  html = path.read_text(encoding="utf-8")

              html = html.replace(
                  "RAW GAME",
                  "ABO ADNAN SAYO"
              )

              html, changed = brand_image.subn(
                  replace_logo,
                  html,
                  count=1
              )

              if changed != 1:
                  raise RuntimeError(
                      "Logo element not found in " + filename
                  )

              custom_css = """
              <style>
              #brand img {
                  width: 96px !important;
                  height: 96px !important;
                  border-radius: 50% !important;
                  object-fit: contain !important;
                  background: white !important;
                  border: 3px solid white !important;
                  padding: 2px !important;
                  margin-right: 10px !important;
                  vertical-align: middle !important;
                  box-sizing: border-box !important;
              }

              #brand {
                  text-align: center;
                  padding: 12px 10px;
              }

              #brand b {
                  font-size: 16px;
                  font-weight: bold;
                  color: white;
                  vertical-align: middle;
              }
              </style>
              """

              html = html.replace(
                  "</head>",
                  custom_css + "\n</head>",
                  1
              )

              path.write_text(
                  html,
                  encoding="utf-8"
              )

          manifest = root / "cache.appcache"

          cache = manifest.read_text(
              encoding="utf-8"
          )

          if not cache.startswith("CACHE MANIFEST"):
              raise RuntimeError("Unexpected cache manifest")

          version = os.environ.get(
              "GITHUB_RUN_ID",
              "1"
          )

          cache = cache.replace(
              "CACHE MANIFEST\n",
              "CACHE MANIFEST\n"
              "# ABO ADNAN LOGO UPDATE "
              + version + "\n"
              + "logo-1.png\n",
              1
          )

          manifest.write_text(
              cache,
              encoding="utf-8"
          )

          (root / ".nojekyll").write_text("")

          (root / "CREDITS.txt").write_text(
              "Host adapted from "
              "https://github.com/raw13g/raw13g.github.io\n"
              "Original LICENSE retained.\n"
              "Third-party code retains its licenses.\n"
              "PS4 FW 13.58 is not supported.\n",
              encoding="utf-8"
          )

          print("==============================")
          print("ABO ADNAN SAYO")
          print("Custom logo installed")
          print("Image: logo-1.png")
          print("Size: 96px")
          print("Shape: Circle")
          print("Cache updated")
          print("==============================")
          PY

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete host
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
