name: Publish ABO ADNAN SAYO PS4 Host

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "logo-1.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ps4-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download original host
        shell: bash
        run: |
          git clone --depth 1 https://github.com/raw13g/raw13g.github.io.git site

          rm -rf site/.git

          if [ ! -f logo-1.png ]; then
            echo "ERROR: logo-1.png not found"
            exit 1
          fi

          cp logo-1.png site/logo-1.png

      - name: Apply custom branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path("site")

          # Check required files
          required = [
              "index.html",
              "jb.html",
              "jb.js",
              "core.js",
              "mem.js",
              "int64.js",
              "ps4_offsets.js",
              "rpc_worker.js",
              "payload2.bin",
              "cache.appcache",
              "logo-1.png"
          ]

          for file in required:
              path = root / file

              if not path.exists():
                  raise RuntimeError(
                      "Missing file: " + file
                  )

          # Update website branding
          for filename in ["index.html", "jb.html"]:

              path = root / filename

              html = path.read_text(
                  encoding="utf-8"
              )

              # Replace original title
              html = html.replace(
                  "RAW GAME",
                  "ABO ADNAN SAYO"
              )

              # Replace original logo
              html = html.replace(
                  "logo_raw.png",
                  "logo-1.png"
              )

              html = html.replace(
                  "abo-logo.svg",
                  "logo-1.png"
              )

              # Custom circular logo
              custom_css = """
              <style>
              #brand img {
                  width: 96px !important;
                  height: 96px !important;
                  border-radius: 50% !important;
                  object-fit: contain !important;
                  background: white !important;
                  border: 3px solid white !important;
                  padding: 2px !important;
                  margin-right: 10px !important;
                  vertical-align: middle !important;
                  box-sizing: border-box !important;
              }

              #brand {
                  text-align: center;
                  padding: 12px 10px;
              }

              #brand b {
                  font-size: 16px;
                  font-weight: bold;
                  color: white;
                  vertical-align: middle;
              }
              </style>
              """

              if "</head>" in html:
                  html = html.replace(
                      "</head>",
                      custom_css + "\n</head>",
                      1
                  )

              path.write_text(
                  html,
                  encoding="utf-8"
              )

          # Update offline cache
          manifest = root / "cache.appcache"

          cache = manifest.read_text(
              encoding="utf-8"
          )

          cache = cache.replace(
              "logo_raw.png",
              "logo-1.png"
          )

          cache = cache.replace(
              "abo-logo.svg",
              "logo-1.png"
          )

          if "logo-1.png" not in cache:
              cache += "\nlogo-1.png\n"

          version = os.environ.get(
              "GITHUB_RUN_ID",
              "1"
          )

          cache = cache.replace(
              "CACHE MANIFEST\n",
              "CACHE MANIFEST\n"
              "# ABO ADNAN LOGO UPDATE "
              + version + "\n",
              1
          )

          manifest.write_text(
              cache,
              encoding="utf-8"
          )

          # Disable Jekyll processing
          (root / ".nojekyll").write_text("")

          print("================================")
          print("ABO ADNAN SAYO")
          print("Custom logo installed")
          print("Logo: logo-1.png")
          print("Logo size: 96px")
          print("GitHub Pages ready")
          print("================================")

          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
